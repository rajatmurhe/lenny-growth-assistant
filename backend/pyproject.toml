[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lenny-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    "anthropic>=0.40",
    "tiktoken>=0.7",
    "nh3>=0.2",
    "python-multipart>=0.0.9",
    "structlog>=24",
    "pyyaml>=6",
    "greenlet>=3",
    "pgvector>=0.2"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx", "factory-boy", "faker"]
